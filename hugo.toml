baseURL = "http://localhost:1313/"
theme = "blowfish"
defaultContentLanguage = "en"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  colorScheme = "blowfish"
  # This hides the author module completely across the site to prevent template crashes
  showAuthor = false
  showAuthorBottom = false
  
  [params.homepage]
    layout = "page"

  [params.header]
    layout = "basic"

# Menu configuration for the top navigation links
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 2

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 3